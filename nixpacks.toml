[phases.setup]
nixPkgs = ["chromium", "nodejs_22"]
aptPkgs = ["libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libgbm1", "libasound2t64", "libpangocairo-1.0-0", "libxss1", "libgtk-3-0", "libxshmfence1", "libglu1-mesa"]

[phases.install]
cmds = ["corepack enable pnpm && corepack prepare pnpm@10.32.1 --activate && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "node .next/standalone/server.js"
