[phases.setup]
nixPkgs = ["nodejs_22", "chromium"]
aptPkgs = [
  "fonts-liberation",
  "libappindicator3-1",
  "libasound2t64",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libgbm1",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libxss1",
  "libxtst6",
  "xdg-utils",
  "libcups2",
  "libxshmfence1"
]

[phases.install]
cmds = ["npx --yes pnpm@10.32.1 install --frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@10.32.1 run build"]

[start]
cmd = "node .next/standalone/server.js"
